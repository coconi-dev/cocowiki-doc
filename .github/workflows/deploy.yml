# 构建 CoCoWiki 文档站，并将生成的静态文件发布到 GitHub Pages。
name: 部署 CoCoWiki 文档站

on:
  # 推送到 main 分支后自动部署。
  push:
    branches: [main]

  # 也可以在 GitHub 仓库的 Actions 页面手动触发部署。
  workflow_dispatch:

# GitHub Pages 发布所需的最小权限。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只执行一次 Pages 部署，不中断正在发布的版本。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建文档站
    runs-on: ubuntu-latest
    steps:
      # 拉取完整仓库历史，供页面更新时间等功能使用。
      - name: 拉取代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 安装项目使用的 pnpm 版本。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      # 安装 Node.js，并启用 pnpm 依赖缓存。
      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # 初始化 GitHub Pages 构建环境。
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v4

      # 严格按照锁文件安装 npm 上发布的 CoCoWiki 与其他依赖。
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # CoCoWiki 会将纯静态站点输出到 dist/。
      - name: 构建站点
        run: pnpm build

      # 上传 dist/，供后续部署任务发布。
      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 将构建任务上传的静态文件正式发布到 Pages。
      - name: 发布站点
        id: deployment
        uses: actions/deploy-pages@v4
